# Builds the ComfyUI + H3 Editor image in the cloud and pushes it to Docker Hub.
# Runs whenever Dockerfile, start.sh or extra_model_paths.yaml change on main,
# or manually from the Actions tab ("Run workflow").
# Builds from main are tagged :latest and :vN. Builds from any other branch get only
# :<branch>-vN, so trying a branch never changes the image your pods use.
name: Build and push image

on:
  push:
    branches: [main, project-archives]
    paths:
      - Dockerfile
      - start.sh
      - extra_model_paths.yaml
      - workflows/**
      - loras/**
      - patches/**
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-h3-editor

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # GitHub's free runners have limited disk; the image needs ~15 GB to build.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main: :latest and a version number (:v1, :v2, ...). Other branches: :<branch>-vN only.
      # Use the version tag in RunPod to be sure you get exactly that build.
      - name: Choose tags
        id: tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "version=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\n%s\n%s\nEOF\n' "${IMAGE}:latest" "${IMAGE}:v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            branch="$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9_.-\n' '-')"
            echo "version=${branch}-v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\n%s\nEOF\n' "${IMAGE}:${branch}-v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}

      - name: Summary
        run: |
          echo "### ✅ Pushed \`${IMAGE}:${{ steps.tags.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this tag in your RunPod template." >> "$GITHUB_STEP_SUMMARY"
